
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Profile</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            padding: 30px;
            background: #161b22;
            border-radius: 15px;
        }

        img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #58a6ff;
        }

        h1 {
            color: #58a6ff;
        }

        p {
            color: #c9d1d9;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 20px;
            background: #238636;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #2ea043;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://github.com/USERNAME.png" alt="Profile Picture">

        <h1>Your Name</h1>

        <p>
            Hello! I am a passionate developer.
            I love coding, learning new technologies,
            and building amazing projects.
        </p>

        <h2>My Skills</h2>
        <p>HTML | CSS | JavaScript | Python | GitHub</p>

        <a href="https://github.com/USERNAME" target="_blank">
            Visit My GitHub
        </a>

        <a href="https://github.com/USERNAME?tab=repositories">
            My Projects
        </a>
    </div>

</body>
</html>
